[project]
name = "agentic-mvp-creator"
version = "0.1.0"
description = "Agentic MVP generation pipeline from a Telegram or HTTP request to a reviewed GitHub PR."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = []
keywords = ["agentic-ai", "ai-agents", "telegram-bot", "fastapi", "code-generation", "llm", "mvp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Code Generators",
]

[project.urls]
Repository = "https://github.com/aimensoo/agentic-mvp-creator"
Documentation = "https://github.com/aimensoo/agentic-mvp-creator/tree/main/docs"
Issues = "https://github.com/aimensoo/agentic-mvp-creator/issues"
Changelog = "https://github.com/aimensoo/agentic-mvp-creator/blob/main/CHANGELOG.md"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  "workspaces",
  ".opencode-share",
  ".opencode-state",
]

[tool.ruff.lint]
select = ["F821", "F822", "F823"]
